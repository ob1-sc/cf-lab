---
- name: Deploy Avi Controller for TAS 
  hosts: localhost
  gather_facts: false
  collections:
    - vmware.alb
    - vmware.ansible_for_nsxt

  roles:
    - role: controller
      tags: ["avi","controller"]
    - role: cloud
      tags: ["avi","cloud"]
    - role: cf-virtual-service
      tags: ["avi","cf-virtual-service"]
    - role: cp-virtual-service
      tags: ["avi","cp-virtual-service"]